# /config/packages/ev/ev_night.yaml
# Night charging through the charger's OWN timer (needs the integration fork electros-ev-local-ha >= 1.7.0).
#
# "Заряджати за таймером" (input_boolean.ev_night_mode) on  -> timer 23:00-07:00 in the charger. Outside the window the charger does not
#   charge at all (even after a start command), so a car plugged in during the day waits quietly
#   (no start-then-stop, no car beeps), and at 23:00 the charger starts by itself, even if HA is down.
#   At 07:00 the charger stops by itself.
# "Заряджати за таймером" off -> timer cleared: the charger charges as soon as the car is plugged in.
#
# Every timer command also sets the charger clock to HA time: the timer runs on that clock, which drifts
# about 20 s a day. No confirmation after 3 tries -> push.
#
# A timer command ALSO clears a stop: a charger that was stopped (by the card, the no-grid safety, ...) starts
# charging again if the car is plugged in and the new timer allows it (seen 13.11 21:03).
# "Start" (card, charger web page) is a one-off override of the timer: the charger charges at once and the
# timer reads as off until a stop or a timer command ends it. Unplugging does NOT end it: the next plug-in would
# charge at once, at any hour (owner's tests 14.11). So timer commands are sent only when they are needed:
#   - the owner changed the mode: always (after 3 s of no further changes; only the last toggle counts);
#   - night mode on: daily at 12:00 to keep the clock right (the timer forbids charging at that hour anyway),
#     and when the timer or the clock in the charger is wrong, but never during the night window;
#   - night mode on and a one-off charge (timer off) runs in the day: nothing, it is the owner's choice;
#     once it is over (not charging for 1 min: stopped, unplugged, car full) the timer is sent, so the override
#     does not stay; at night (from 23:00) it is sent at once: the charge goes on by the timer, stops at 07:00;
#   - night mode off: only when a timer is still in the charger.
# Nothing is sent while the charger is unavailable; it is checked again a minute after it comes back.
#
# The charger starts with the current stored in it; ev_current_apply (below) then sends the current set on
# the card, if it differs.
#
# Home battery at night: the night TOU programs (1 and 6, 80 %, Grid Charge) do not let it discharge.

input_boolean:
  ev_night_mode:
    name: "Авто: заряджати за таймером"
    icon: mdi:weather-night

automation:
  - id: ev_night_timer
    alias: "Авто: ніч — таймер у зарядці"
    description: "Ставить 23:00–07:00 у зарядці, коли «за таймером» увімкнено, і знімає таймер, коли вимкнено. Заодно виставляє годинник зарядки."
    # restart: a new trigger cancels a run still waiting or retrying, so a quick off-on counts once, as the last state.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.ev_night_mode
        to: ["on", "off"]
        id: mode
      - trigger: time
        at: "12:00:00"
        id: daily
      - trigger: homeassistant
        event: start
        id: start
      # The timer changed in the charger (web page, restart) or the charger came back: check it.
      # Not on unavailable / unknown: there is nothing to talk to then.
      - trigger: state
        entity_id: sensor.electros_timer
        not_to: ["unavailable", "unknown"]
        for: { minutes: 1 }
        id: check
      - trigger: numeric_state
        entity_id: sensor.electros_clock_offset
        above: 60
        for: { minutes: 1 }
        id: check
      - trigger: numeric_state
        entity_id: sensor.electros_clock_offset
        below: -60
        for: { minutes: 1 }
        id: check
      # A one-off charge is over (stopped, unplugged, car full): end the override.
      - trigger: state
        entity_id: switch.electros_charging
        to: "off"
        for: { minutes: 1 }
        id: check
      # The night starts: a one-off charge still running goes on by the timer.
      - trigger: time
        at: "23:01:00"
        id: check
    variables:
      timer_entity: sensor.electros_timer
      clock_entity: sensor.electros_clock_offset
    conditions:
      # No grid: ev_safety took the timer out on purpose and puts it back when the grid returns.
      - condition: state
        entity_id: input_boolean.ev_paused_no_grid
        state: "off"
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: start
            sequence:
              - delay: { minutes: 1 }   # wait for the ElectroS integration to connect
          - conditions:
              - condition: trigger
                id: mode
            sequence:
              - delay: { seconds: 3 }   # a quick off-on restarts this run: only the last state is sent
      # Charger offline: send nothing and do not push; the `check` trigger runs a minute after it is back.
      - if:
          - condition: template
            value_template: "{{ not has_value(timer_entity) }}"
        then:
          - action: logbook.log
            data:
              name: "Авто: ніч"
              message: "Зарядка недоступна — таймер перевірю, коли вона повернеться ({{ trigger.id }})"
          - stop: "Charger unavailable"
      - variables:
          night: "{{ is_state('input_boolean.ev_night_mode', 'on') }}"
          night_window: "{{ now().hour >= 23 or now().hour < 7 }}"
          ok_timer: >
            {{ (is_state_attr(timer_entity, 'enabled', true)
                and state_attr(timer_entity, 'start') == '23:00'
                and state_attr(timer_entity, 'end') == '07:00')
               if night else is_state_attr(timer_entity, 'enabled', false) }}
          ok_clock: "{{ states(clock_entity) | float(999) | abs <= 60 }}"
          # a one-off charge: "start" overrides the timer, which then reads as off
          one_off: "{{ is_state_attr(timer_entity, 'enabled', false) }}"
          charging: "{{ is_state('switch.electros_charging', 'on') }}"
      # When to send (see the header): every send also clears a stop in the charger.
      - condition: template
        value_template: >
          {% if trigger.id == 'mode' %}true
          {% elif not night %}{{ not ok_timer }}
          {% elif one_off and charging and not night_window %}false
          {% elif night_window %}{{ one_off }}
          {% elif trigger.id == 'daily' %}true
          {% else %}{{ not (ok_timer and ok_clock) }}{% endif %}
      - repeat:
          sequence:
            - if:
                - condition: template
                  value_template: "{{ night }}"
              then:
                - action: electros_ev_local.set_timer
                  data: { start: "23:00", end: "07:00" }
                  continue_on_error: true
              else:
                - action: electros_ev_local.clear_timer
                  continue_on_error: true
            - variables:
                ok: >
                  {% set ok_timer = (is_state_attr(timer_entity, 'enabled', true)
                                     and state_attr(timer_entity, 'start') == '23:00'
                                     and state_attr(timer_entity, 'end') == '07:00')
                                    if night else is_state_attr(timer_entity, 'enabled', false) %}
                  {{ ok_timer and states(clock_entity) | float(999) | abs <= 60 }}
            - if:
                - condition: template
                  value_template: "{{ not ok and repeat.index < 3 }}"
              then:
                - delay: { seconds: 30 }
          until: "{{ ok or repeat.index >= 3 or not has_value(timer_entity) }}"
      - if:
          - condition: template
            value_template: "{{ ok }}"
        then:
          - action: logbook.log
            data:
              name: "Авто: ніч"
              message: >
                {{ 'Таймер 23:00–07:00 у зарядці' if night else 'Таймер у зарядці вимкнено' }},
                годинник зарядки виставлено ({{ trigger.id }})
        else:
          - if:
              - condition: template
                value_template: "{{ not has_value(timer_entity) }}"
            then:
              # The charger went away while we were trying: not a failure to report, it is checked on return.
              - action: logbook.log
                data:
                  name: "Авто: ніч"
                  message: "Зарядка зникла під час встановлення таймера — перевірю, коли повернеться"
            else:
              - action: notify.mobile_app_oleksiy_iphone
                data:
                  title: "Авто: таймер зарядки НЕ встановлено"
                  message: >
                    Зарядка на зв'язку, але не підтвердила {{ 'таймер 23:00–07:00' if night else 'вимкнення таймера' }}
                    після 3 спроб. Зараз у зарядці: {{ states(timer_entity) }}.
              - action: persistent_notification.create
                data:
                  notification_id: ev_night
                  title: "Авто: таймер зарядки НЕ встановлено"
                  message: "Зарядка на зв'язку, але не підтвердила таймер після 3 спроб. Зараз у зарядці: {{ states(timer_entity) }}."

  # The card current is the charging current. The charger keeps its own stored current and starts with it
  # (at 23:00 by the timer, or when the car is plugged in); a new current reaches the charger only while it
  # charges. So once charging runs, HA sends the current set on the card if the charger has a different one.
  # HA never picks a current itself (the 22 A safety ceiling in ev_safety.yaml is the only exception).
  - id: ev_current_apply
    alias: "Авто: струм з картки на старті зарядки"
    description: "Коли зарядка почалась, а в самій зарядці інший струм, ніж на картці, — надсилає струм з картки."
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.electros_charging
        to: "on"
        for: { seconds: 10 }
    conditions:
      - condition: template
        value_template: >
          {{ has_value('number.electros_charging_current') and has_value('sensor.electros_set_current')
             and states('number.electros_charging_current') | int != states('sensor.electros_set_current') | int }}
    actions:
      - variables:
          wanted: "{{ states('number.electros_charging_current') | int }}"
      - action: number.set_value
        target: { entity_id: number.electros_charging_current }
        data: { value: "{{ wanted }}" }
        continue_on_error: true
      - delay: { seconds: 15 }
      - if:
          - condition: template
            value_template: "{{ states('sensor.electros_set_current') | int(0) == wanted }}"
        then:
          - action: logbook.log
            data:
              name: "Авто: струм"
              message: "Зарядка почалась — струм з картки {{ wanted }} A"
        else:
          - action: notify.mobile_app_oleksiy_iphone
            data:
              title: "Авто: струм з картки не застосовано"
              message: >
                На картці {{ wanted }} A, а зарядка заряджає на {{ states('sensor.electros_set_current') }} A.
                Змініть струм на картці ще раз.

  # Fallback: the car charges in the day without "hold battery".
  # Night mode on and the timer is in the charger -> the timer did not work: stop and tell.
  # Otherwise (night mode off, or a one-off charge: "start" overrides the timer, which then reads as off)
  # the owner wants to charge now -> hold the home battery.
  - id: ev_day_charge_guard
    alias: "Авто: зарядка почалась сама вдень"
    triggers:
      - trigger: numeric_state
        entity_id: sensor.ev_charger_power
        above: 300
        for: { seconds: 10 }
    conditions:
      # 5 min margin: the charger timer runs on the charger clock (it runs a little fast), so its 23:00
      # start can come a few seconds before 23:00 by HA time and must not look like a daytime start.
      - condition: time
        after: "07:05:00"
        before: "22:55:00"
      # "hold battery" on = the card button was used, so the user wants to charge now
      - condition: state
        entity_id: input_boolean.ev_battery_hold
        state: "off"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.ev_night_mode
                state: "on"
              - condition: template
                value_template: "{{ is_state_attr('sensor.electros_timer', 'enabled', true) }}"
            sequence:
              - action: switch.turn_off
                target: { entity_id: switch.electros_charging }
                continue_on_error: true
              - action: notify.mobile_app_oleksiy_iphone
                data:
                  title: "Авто: зарядка почалась вдень, хоча таймер мав заборонити"
                  message: >
                    Таймер у зарядці: {{ states('sensor.electros_timer') }}.
                    Зарядку {{ 'зупинено' if not is_state('switch.electros_charging', 'on') else 'НЕ вдалося зупинити' }}.
        default:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.ev_battery_hold }
          - action: logbook.log
            data:
              name: "Авто: тримати батарею"
              message: "Зарядка вдень — утримання батареї ввімкнено автоматично"
