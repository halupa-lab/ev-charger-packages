# /config/packages/ev/ev_night.yaml
# Night charging through the charger's OWN timer (needs the integration fork electros-ev-local-ha >= 1.7.0).
#
# "Заряджати лише вночі" on  -> timer 23:00-07:00 in the charger. Outside the window the charger does not
#   charge at all (even after a start command), so a car plugged in during the day waits quietly
#   (no start-then-stop, no car beeps), and at 23:00 the charger starts by itself, even if HA is down.
#   At 07:00 the charger stops by itself.
# "Заряджати лише вночі" off -> timer cleared: the charger charges as soon as the car is plugged in.
#
# Every timer command also sets the charger clock to HA time: the timer runs on that clock, which drifts
# about 20 s a day. The timer is (re)sent when the mode changes, daily at 12:00, after an HA start, and when
# the timer or the clock in the charger is not what it should be. No confirmation after 3 tries -> push.
#
# The charger starts with the current stored in it; ev_current_apply (below) then sends the current set on
# the card, if it differs.
#
# Home battery at night: the night TOU programs (1 and 6, 80 %, Grid Charge) do not let it discharge.

input_boolean:
  ev_night_mode:
    name: "Авто: заряджати лише вночі"
    icon: mdi:weather-night

automation:
  - id: ev_night_timer
    alias: "Авто: ніч — таймер у зарядці"
    description: "Ставить 23:00–07:00 у зарядці, коли «лише вночі» увімкнено, і знімає таймер, коли вимкнено. Заодно виставляє годинник зарядки."
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: input_boolean.ev_night_mode
        to: ["on", "off"]
        id: mode
      - trigger: time
        at: "12:00:00"
        id: daily
      - trigger: homeassistant
        event: start
        id: start
      # Someone changed the timer (charger web page) or it got lost: put it back.
      - trigger: state
        entity_id: sensor.electros_timer
        for: { minutes: 1 }
        id: check
      - trigger: numeric_state
        entity_id: sensor.electros_clock_offset
        above: 60
        for: { minutes: 1 }
        id: check
      - trigger: numeric_state
        entity_id: sensor.electros_clock_offset
        below: -60
        for: { minutes: 1 }
        id: check
    variables:
      timer_entity: sensor.electros_timer
      clock_entity: sensor.electros_clock_offset
    actions:
      - if:
          - condition: trigger
            id: start
        then:
          - delay: { minutes: 1 }   # wait for the ElectroS integration to connect
      # Mode change and the daily run always send (the daily run keeps the clock right);
      # the other triggers send only when the charger is not as it should be.
      - condition: template
        value_template: >
          {% set night = is_state('input_boolean.ev_night_mode', 'on') %}
          {% set ok_timer = (is_state_attr(timer_entity, 'enabled', true)
                             and state_attr(timer_entity, 'start') == '23:00'
                             and state_attr(timer_entity, 'end') == '07:00')
                            if night else is_state_attr(timer_entity, 'enabled', false) %}
          {% set ok_clock = states(clock_entity) | float(999) | abs <= 60 %}
          {{ trigger.id in ['mode', 'daily'] or not (ok_timer and ok_clock) }}
      - repeat:
          sequence:
            - if:
                - condition: state
                  entity_id: input_boolean.ev_night_mode
                  state: "on"
              then:
                - action: electros_ev_local.set_timer
                  data: { start: "23:00", end: "07:00" }
                  continue_on_error: true
              else:
                - action: electros_ev_local.clear_timer
                  continue_on_error: true
            - variables:
                ok: >
                  {% set night = is_state('input_boolean.ev_night_mode', 'on') %}
                  {% set ok_timer = (is_state_attr(timer_entity, 'enabled', true)
                                     and state_attr(timer_entity, 'start') == '23:00'
                                     and state_attr(timer_entity, 'end') == '07:00')
                                    if night else is_state_attr(timer_entity, 'enabled', false) %}
                  {{ ok_timer and states(clock_entity) | float(999) | abs <= 60 }}
            - if:
                - condition: template
                  value_template: "{{ not ok and repeat.index < 3 }}"
              then:
                - delay: { seconds: 30 }
          until: "{{ ok or repeat.index >= 3 }}"
      - if:
          - condition: template
            value_template: "{{ ok }}"
        then:
          - action: logbook.log
            data:
              name: "Авто: ніч"
              message: >
                {{ 'Таймер 23:00–07:00 у зарядці' if is_state('input_boolean.ev_night_mode', 'on') else 'Таймер у зарядці вимкнено' }},
                годинник зарядки виставлено ({{ trigger.id }})
        else:
          - action: notify.mobile_app_oleksiy_iphone
            data:
              title: "Авто: таймер зарядки НЕ встановлено"
              message: >
                Зарядка не підтвердила {{ 'таймер 23:00–07:00' if is_state('input_boolean.ev_night_mode', 'on') else 'вимкнення таймера' }}
                після 3 спроб. Зараз у зарядці: {{ states(timer_entity) }}. Перевірте, чи зарядка на зв'язку.
          - action: persistent_notification.create
            data:
              notification_id: ev_night
              title: "Авто: таймер зарядки НЕ встановлено"
              message: "Зарядка не підтвердила таймер після 3 спроб. Зараз у зарядці: {{ states(timer_entity) }}."

  # The card current is the charging current. The charger keeps its own stored current and starts with it
  # (at 23:00 by the timer, or when the car is plugged in); a new current reaches the charger only while it
  # charges. So once charging runs, HA sends the current set on the card if the charger has a different one.
  # HA never picks a current itself (the 22 A safety ceiling in ev_safety.yaml is the only exception).
  - id: ev_current_apply
    alias: "Авто: струм з картки на старті зарядки"
    description: "Коли зарядка почалась, а в самій зарядці інший струм, ніж на картці, — надсилає струм з картки."
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.electros_charging
        to: "on"
        for: { seconds: 10 }
    conditions:
      - condition: template
        value_template: >
          {{ has_value('number.electros_charging_current') and has_value('sensor.electros_set_current')
             and states('number.electros_charging_current') | int != states('sensor.electros_set_current') | int }}
    actions:
      - variables:
          wanted: "{{ states('number.electros_charging_current') | int }}"
      - action: number.set_value
        target: { entity_id: number.electros_charging_current }
        data: { value: "{{ wanted }}" }
        continue_on_error: true
      - delay: { seconds: 15 }
      - if:
          - condition: template
            value_template: "{{ states('sensor.electros_set_current') | int(0) == wanted }}"
        then:
          - action: logbook.log
            data:
              name: "Авто: струм"
              message: "Зарядка почалась — струм з картки {{ wanted }} A"
        else:
          - action: notify.mobile_app_oleksiy_iphone
            data:
              title: "Авто: струм з картки не застосовано"
              message: >
                На картці {{ wanted }} A, а зарядка заряджає на {{ states('sensor.electros_set_current') }} A.
                Змініть струм на картці ще раз.

  # Fallback: the car charges in the day without "hold battery".
  # Night mode on -> the timer did not work: stop and tell. Night mode off -> hold the home battery.
  - id: ev_day_charge_guard
    alias: "Авто: зарядка почалась сама вдень"
    triggers:
      - trigger: numeric_state
        entity_id: sensor.ev_charger_power
        above: 300
        for: { seconds: 10 }
    conditions:
      # 5 min margin: the charger timer runs on the charger clock (it runs a little fast), so its 23:00
      # start can come a few seconds before 23:00 by HA time and must not look like a daytime start.
      - condition: time
        after: "07:05:00"
        before: "22:55:00"
      # "hold battery" on = the card button was used, so the user wants to charge now
      - condition: state
        entity_id: input_boolean.ev_battery_hold
        state: "off"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.ev_night_mode
                state: "on"
            sequence:
              - action: switch.turn_off
                target: { entity_id: switch.electros_charging }
                continue_on_error: true
              - action: notify.mobile_app_oleksiy_iphone
                data:
                  title: "Авто: зарядка почалась вдень, хоча таймер мав заборонити"
                  message: >
                    Таймер у зарядці: {{ states('sensor.electros_timer') }}.
                    Зарядку {{ 'зупинено' if not is_state('switch.electros_charging', 'on') else 'НЕ вдалося зупинити' }}.
        default:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.ev_battery_hold }
          - action: logbook.log
            data:
              name: "Авто: тримати батарею"
              message: "Зарядка почалась сама вдень — утримання ввімкнено автоматично"
