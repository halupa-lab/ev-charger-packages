name: CI

on:
  push:
  pull_request:

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yamllint
      - run: yamllint --strict .

  ha-config-check:
    # Loads the packages exactly like HA does (packages: !include_dir_named packages, repo in packages/ev)
    # and runs the official config check of the current stable Home Assistant.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: config/packages/ev
      - name: Minimal configuration.yaml
        run: |
          cat > config/configuration.yaml <<'YAML'
          homeassistant:
            packages: !include_dir_named packages
          YAML
      - name: Check configuration
        # check_config prints "Incorrect config" / "Invalid config" but can still exit 0, so check the text too.
        run: |
          set -o pipefail
          docker run --rm -v "$PWD/config:/config" \
            ghcr.io/home-assistant/home-assistant:stable \
            python -m homeassistant --script check_config --config /config 2>&1 | tee check.log
          if grep -q -E 'Incorrect config|Invalid config|Failed config|Platform error|Integration error' check.log; then
            echo "::error::Home Assistant config check found errors"
            exit 1
          fi
