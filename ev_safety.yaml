# /config/packages/ev/ev_safety.yaml  (v5)
# Safety for EV charging.
#
# Facts this file relies on (checked in the ElectroS integration code and the Deye manual):
# - switch.electros_charging is "on" ONLY while the charger reports status "charging".
#   turn_on sends the start command, turn_off sends the stop command ("Заборона заряджання").
# - The integration keeps its own target current in HA and sends it to the charger only with
#   the start command or while charging. The REAL value in the charger is the sensor
#   "Налаштований струм".
# - Without grid the Deye TOU limits do not work: the battery can go down to Shutdown 10 %.
#
# 1) No grid -> stop charging. Also when there is NO DATA from Deye for 5 minutes while the car charges
#    (fail-safe: we cannot see the grid, so we assume the worst). Whatever starts charging while
#    there is no grid (23:00, card button, ElectroS web UI) is stopped again.
#    Inside the timer window a stop alone does not hold: the stored timer comes back and the charger
#    charges again at once (owner's test 14.11). So HA first takes the timer out of the charger and keeps
#    it in input_text.ev_timer_before_no_grid, then stops. Without a timer the stop holds.
#    Retried 3 times; if the charger still charges -> urgent push.
# 2) Grid (or data) is back for 2 minutes, after rule 1 -> HA puts the kept timer back. A timer command
#    also clears the stop: inside the window the charger charges again and stops at the timer end by
#    itself; outside it waits for the window. Not a start: a start is a one-off override that ignores
#    the timer (it would not stop at 07:00). Also checked 3 minutes after an HA restart.
#    The charger may restart right after the grid is back: HA waits for it, checks the timer is really
#    back (up to 5 tries) and keeps the kept timer until then; urgent push if it never comes back.
# 3) Current ceiling 22 A (line 5x2.5, breaker C25) -> set back to 20 A.

input_boolean:
  ev_paused_no_grid:
    name: "Авто: зарядку зупинено, бо немає мережі"
    icon: mdi:transmission-tower-off

input_text:
  ev_timer_before_no_grid:
    name: "Авто: таймер зарядки до зникнення мережі"
    icon: mdi:timer-off-outline
    max: 20

automation:
  - id: ev_safety_grid_lost
    alias: "Авто: безпека — немає мережі, вимкнути зарядку"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.deye_inverter_grid
        to: "off"
        for: { seconds: 5 }
        id: no_grid
      - trigger: state
        entity_id: binary_sensor.deye_inverter_grid
        to: ["unavailable", "unknown"]
        for: { minutes: 5 }
        id: no_data
      - trigger: state
        entity_id: switch.electros_charging
        to: "on"
        id: charging_started
    conditions:
      - condition: state
        entity_id: switch.electros_charging
        state: "on"
      # grid is off, or there is no data from Deye for 5 minutes or more
      - condition: template
        value_template: >
          {% set s = states.binary_sensor.deye_inverter_grid %}
          {{ s is none or s.state == 'off'
             or (s.state != 'on' and (now() - s.last_changed).total_seconds() >= 300) }}
    actions:
      # Since the integration fork v1.6.1 a command the charger did not get raises an error:
      # retry, and check the switch (it is "on" only while the charger really charges).
      - repeat:
          sequence:
            # A timer in the charger: keep it (only the first one: later tries see it cleared), clear it.
            - if:
                - condition: template
                  value_template: "{{ is_state_attr('sensor.electros_timer', 'enabled', true) }}"
              then:
                - if:
                    - condition: template
                      value_template: "{{ states('input_text.ev_timer_before_no_grid') is not match('[0-9]{2}:[0-9]{2} [0-9]{2}:[0-9]{2}$') }}"
                  then:
                    - action: input_text.set_value
                      target: { entity_id: input_text.ev_timer_before_no_grid }
                      data:
                        value: >-
                          {{ state_attr('sensor.electros_timer', 'start') }} {{ state_attr('sensor.electros_timer', 'end') }}
                - action: electros_ev_local.clear_timer
                  continue_on_error: true
            - action: switch.turn_off
              target: { entity_id: switch.electros_charging }
              continue_on_error: true
            - if:
                - condition: state
                  entity_id: switch.electros_charging
                  state: "on"
              then:
                - delay: { seconds: 5 }
          until:
            - condition: template
              value_template: "{{ not is_state('switch.electros_charging', 'on') or repeat.index >= 3 }}"
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.ev_paused_no_grid }
      - if:
          - condition: state
            entity_id: switch.electros_charging
            state: "on"
        then:
          - action: notify.mobile_app_oleksiy_iphone
            data:
              title: "Авто: НЕ вдалося вимкнути зарядку без мережі"
              message: >
                Машина розряджає батарею будинку. Вимкніть зарядку вручну
                (вебсторінка зарядки або автомат на лінії).
              data:
                push:
                  interruption-level: time-sensitive
      - action: persistent_notification.create
        data:
          notification_id: ev_safety
          title: >
            {% if is_state('switch.electros_charging', 'on') %}Авто: НЕ вдалося вимкнути зарядку
            {%- elif is_state('binary_sensor.deye_inverter_grid', 'off') %}Авто: немає мережі — зарядку вимкнено
            {%- else %}Авто: немає даних з інвертора — зарядку вимкнено{% endif %}
          message: >
            Без мережі машина розряджала б батарею будинку.
            Таймер зарядки на цей час знято. Коли мережа (і дані з інвертора) повернуться, HA поверне таймер:
            у його години (уночі) зарядка продовжиться сама, в інший час — натисніть «Почати зарядку» на картці.

  - id: ev_safety_grid_back
    alias: "Авто: безпека — мережа повернулась"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.deye_inverter_grid
        to: "on"
        for: { minutes: 2 }
      # HA restarted while the grid was back: the trigger above would never fire, the timer would stay out.
      - trigger: homeassistant
        event: start
        id: start
    conditions:
      - condition: state
        entity_id: input_boolean.ev_paused_no_grid
        state: "on"
    actions:
      - if:
          - condition: trigger
            id: start
        then:
          - delay: { minutes: 3 }
      - condition: state
        entity_id: binary_sensor.deye_inverter_grid
        state: "on"
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.ev_paused_no_grid }
      - variables:
          kept: "{{ states('input_text.ev_timer_before_no_grid') }}"
          restore: "{{ kept is match('[0-9]{2}:[0-9]{2} [0-9]{2}:[0-9]{2}$') }}"
          # the kept timer, or the one in the charger now (a one-off charge stopped by rule 1)
          t_start: >-
            {{ kept.split(' ')[0] if restore
               else state_attr('sensor.electros_timer', 'start') if is_state_attr('sensor.electros_timer', 'enabled', true)
               else '' }}
          t_end: >-
            {{ kept.split(' ')[1] if restore
               else state_attr('sensor.electros_timer', 'end') if is_state_attr('sensor.electros_timer', 'enabled', true)
               else '' }}
          # the timer allows charging now (the window may cross midnight)
          in_window: >
            {% set n = now().strftime('%H:%M') %}
            {% if not t_start or not t_end %}false
            {% elif t_start < t_end %}{{ t_start <= n and n < t_end }}
            {% else %}{{ n >= t_start or n < t_end }}{% endif %}
      - if:
          - condition: template
            value_template: "{{ restore or in_window }}"
        then:
          # Puts the timer back and clears the stop: inside the window the charger charges again.
          # The charger may restart a minute or two after the grid is back (14.11: a command sent while it
          # was restarting was lost, and after the restart it had neither the timer nor the stop, so it
          # charged). So: wait until it answers, send, check the timer is really there; up to 5 tries.
          # A restart after that keeps the timer.
          - repeat:
              sequence:
                - wait_template: "{{ has_value('sensor.electros_timer') }}"
                  timeout: { minutes: 3 }
                - delay: { seconds: 20 }   # a charger that just came back: let it settle
                - action: electros_ev_local.set_timer
                  data:
                    start: "{{ t_start }}"
                    end: "{{ t_end }}"
                  continue_on_error: true
                - if:
                    - condition: template
                      value_template: >
                        {{ not (state_attr('sensor.electros_timer', 'start') == t_start
                                and state_attr('sensor.electros_timer', 'end') == t_end) and repeat.index < 5 }}
                  then:
                    - delay: { seconds: 30 }
              until:
                - condition: template
                  value_template: >
                    {{ (state_attr('sensor.electros_timer', 'start') == t_start and state_attr('sensor.electros_timer', 'end') == t_end) or repeat.index >= 5 }}
          - if:
              - condition: template
                value_template: >
                  {{ (state_attr('sensor.electros_timer', 'start') == t_start and state_attr('sensor.electros_timer', 'end') == t_end) }}
            then:
              - action: input_text.set_value
                target: { entity_id: input_text.ev_timer_before_no_grid }
                data: { value: "" }
            else:
              # The kept timer stays in input_text.ev_timer_before_no_grid.
              - action: notify.mobile_app_oleksiy_iphone
                data:
                  title: "Авто: мережа повернулась, але таймер зарядки НЕ повернуто"
                  message: >
                    Треба було {{ t_start }}–{{ t_end }}, у зарядці: {{ states('sensor.electros_timer') }}.
                    Зарядка може заряджати будь-коли. Вимкніть і знову увімкніть «Заряджати за таймером» на картці.
                  data:
                    push:
                      interruption-level: time-sensitive
              - action: persistent_notification.create
                data:
                  notification_id: ev_safety
                  title: "Авто: мережа повернулась, але таймер зарядки НЕ повернуто"
                  message: "Треба було {{ t_start }}–{{ t_end }}, у зарядці: {{ states('sensor.electros_timer') }}."
              - stop: "Timer not restored"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ in_window }}"
            sequence:
              - wait_template: "{{ is_state('switch.electros_charging', 'on') }}"
                timeout: { seconds: 60 }
              - if:
                  - condition: state
                    entity_id: switch.electros_charging
                    state: "on"
                then:
                  - action: persistent_notification.create
                    data:
                      notification_id: ev_safety
                      title: "Авто: мережа повернулась — зарядку продовжено"
                      message: "Зарядку було зупинено через відсутність мережі. Зупиниться сама о {{ t_end }} (таймер зарядки)."
                else:
                  - action: notify.mobile_app_oleksiy_iphone
                    data:
                      title: "Авто: мережа повернулась, але зарядка НЕ продовжилась"
                      message: "Таймер {{ t_start }}–{{ t_end }} надіслано, а зарядка не почала. Гляньте картку."
                  - action: persistent_notification.create
                    data:
                      notification_id: ev_safety
                      title: "Авто: мережа повернулась, але зарядка НЕ продовжилась"
                      message: "Таймер {{ t_start }}–{{ t_end }} надіслано, а зарядка не почала."
          - conditions:
              - condition: template
                value_template: "{{ restore }}"
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: ev_safety
                  title: "Авто: мережа повернулась — таймер {{ t_start }}–{{ t_end }} повернуто"
                  message: "Зарядка почне сама за таймером. Якщо треба зараз — «Почати зарядку» на картці."
        default:
          - action: persistent_notification.create
            data:
              notification_id: ev_safety
              title: "Авто: мережа повернулась"
              message: "Зараз не години таймера зарядки, тож сама не продовжилась. Якщо треба — «Почати зарядку» на картці."

  - id: ev_safety_current_limit
    alias: "Авто: безпека — струм не більше 22 A"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: number.electros_charging_current
        above: 22
      - trigger: numeric_state
        entity_id: sensor.electros_set_current
        above: 22
      - trigger: numeric_state
        entity_id: sensor.ev_charger_power
        above: 300
        for: { seconds: 5 }
      # re-check every minute while charging (in case a command to the charger was lost)
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: or
        conditions:
          # the HA value is too high: fix it at any time
          - condition: numeric_state
            entity_id: number.electros_charging_current
            above: 22
          # the value in the charger is too high: HA can change it only while charging
          - condition: and
            conditions:
              - condition: numeric_state
                entity_id: sensor.electros_set_current
                above: 22
              - condition: numeric_state
                entity_id: sensor.ev_charger_power
                above: 300
    actions:
      - action: number.set_value
        target: { entity_id: number.electros_charging_current }
        data: { value: 20 }
      - action: persistent_notification.create
        data:
          notification_id: ev_safety_current
          title: "Авто: струм понад 22 A — повернуто 20 A"
          message: "Лінія зарядки (5×2.5, автомат C25) розрахована до 22 A."
