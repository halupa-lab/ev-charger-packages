# /config/packages/ev/ev_charge_now.yaml
# "Зарядити зараз" (card button): charge now, once, even while "charge only at night" keeps the charger timer on.
#
# A start command does NOT override the charger timer (owner's test 2026-11-10), so in the day the script
# turns "charge only at night" off (ev_night_timer then clears the timer in the charger), waits for the charger
# to start by itself, and sends start only if it did not. When this one-off charge is over (charging stopped
# for 10 min, or the car unplugged), "charge only at night" is turned back on, and the timer with it.
#
# In the day the home battery is held first (the car should take sun and grid, not the battery).
# At night (23:00-07:00) the timer already allows charging, so only start is sent.

input_boolean:
  ev_charge_now:
    name: "Авто: разова зарядка зараз"
    icon: mdi:flash

script:
  ev_charge_now:
    alias: "Авто: зарядити зараз"
    description: "Разова зарядка зараз: знімає нічний таймер (потім поверне), тримає батарею будинку вдень і запускає зарядку."
    icon: mdi:ev-plug-type1
    mode: single
    variables:
      night_window: "{{ now().hour >= 23 or now().hour < 7 }}"
      timer_in_the_way: "{{ is_state('input_boolean.ev_night_mode', 'on') and not night_window }}"
    sequence:
      - if:
          - condition: state
            entity_id: switch.electros_charging
            state: "on"
        then:
          - action: logbook.log
            data:
              name: "Авто: зарядити зараз"
              message: "Вже заряджає — нічого не змінено"
          - stop: "Already charging"

      # Hold first: the inverter must stop discharging the battery before the car takes power.
      - if:
          - condition: template
            value_template: "{{ not night_window }}"
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.ev_battery_hold }

      - if:
          - condition: template
            value_template: "{{ timer_in_the_way }}"
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.ev_charge_now }
          # ev_night_timer clears the timer (and checks it, and pushes if the charger does not confirm).
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.ev_night_mode }
          - wait_template: "{{ is_state_attr('sensor.electros_timer', 'enabled', false) }}"
            timeout: { minutes: 2 }
            continue_on_timeout: true

      # The charger may start by itself once nothing forbids it; send start only if it does not.
      - wait_template: "{{ is_state('switch.electros_charging', 'on') }}"
        timeout: { seconds: 20 }
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ not is_state('switch.electros_charging', 'on') }}"
        then:
          - action: logbook.log
            data:
              name: "Авто: зарядити зараз"
              message: "Зарядка сама не почала за 20 с — надсилаю «почати»"
          - action: switch.turn_on
            target: { entity_id: switch.electros_charging }
            continue_on_error: true
          - wait_template: "{{ is_state('switch.electros_charging', 'on') }}"
            timeout: { seconds: 30 }
            continue_on_timeout: true

      - if:
          - condition: state
            entity_id: switch.electros_charging
            state: "on"
        then:
          - action: logbook.log
            data:
              name: "Авто: зарядити зараз"
              message: >
                Зарядка почалась{{ ' (нічний таймер знято до кінця зарядки)' if timer_in_the_way else '' }}
        else:
          # Nothing started: put night mode back at once, so the timer is not left off.
          - if:
              - condition: state
                entity_id: input_boolean.ev_charge_now
                state: "on"
            then:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.ev_charge_now }
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.ev_night_mode }
          - action: notify.mobile_app_oleksiy_iphone
            data:
              title: "Авто: зарядка не почалась"
              message: >
                «Зарядити зараз» не спрацювало. Статус зарядки: {{ states('sensor.electros_status') }}.
                Чи підключена машина?

automation:
  - id: ev_charge_now_done
    alias: "Авто: разова зарядка — повернути «лише вночі»"
    description: "Коли разова зарядка закінчилась (зарядка стоїть 10 хв або машину відключили), знову вмикає «лише вночі» і таймер."
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.electros_charging
        from: "on"
        to: "off"
        for: { minutes: 10 }
      - trigger: template
        value_template: "{{ state_attr('sensor.electros_status', 'status_code') == '0' }}"   # waiting for vehicle = unplugged
        for: { minutes: 1 }
    conditions:
      - condition: state
        entity_id: input_boolean.ev_charge_now
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.ev_charge_now }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.ev_night_mode }
      - action: logbook.log
        data:
          name: "Авто: зарядити зараз"
          message: "Разова зарядка закінчилась — «лише вночі» знову увімкнено"
